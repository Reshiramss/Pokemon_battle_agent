# Default configuration for a PokeAgent battle run.
# Values here override the AgentConfig defaults; CLI/env can override further.
[agent]
model = "your-model-name"
# compressor_model = "your-model-name" # cheap model for background compression / reviews
provider = "openai"                        # key into providers registry
base_url = "https://api.example.com/v1" # internal vLLM endpoint; unset -> OPENAI_BASE_URL
# api_key = "..."                         # unset -> OPENAI_API_KEY env var, else "EMPTY"
# battle_format = "gen9randombattle"
# server = "localhost"                    # localhost | showdown
server_port = 8964                        # port 8000 is taken by another user's service
# turn_budget = 45.0                     # hard per-turn wall clock (seconds)
# max_tool_rounds = 6
# runs_dir = "runs"
